name: Validate BookOnTime
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: npm run verify:build
      - run: npm run build:android
      - run: npm run security:check
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run android:sync
      - run: chmod +x android/gradlew
      - run: android/gradlew -p android :app:assembleRelease :app:lintRelease --no-daemon
      - run: node scripts/verify-android-security.ts android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
